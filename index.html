<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Browser tab, bookmarks, and installable-app icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a120b" />
    <meta name="apple-mobile-web-app-title" content="Boring Internet" />

    <title>Boring Internet</title>

    <!-- Defaults for crawlers that do not run JS; pages override these at runtime. -->
    <meta
      name="description"
      content="A hand-checked directory of launched sites that load fast, respect your attention, and skip the growth tactics. Browse by category, see what is trending, and submit your own."
    />
    <link rel="canonical" href="https://boringinternet.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Boring Internet" />
    <meta property="og:title" content="Boring Internet — a quiet list of launched sites" />
    <meta
      property="og:description"
      content="A hand-checked directory of launched sites that load fast, respect your attention, and skip the growth tactics."
    />
    <meta property="og:url" content="https://boringinternet.org/" />
    <meta property="og:image" content="https://boringinternet.org/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Boring Internet</h1>
      <p>
        A quiet list of launched sites. JavaScript is off, so the directory cannot render — you can
        still read the <a href="/sitemap.xml">sitemap</a> or the
        <a href="/blog">blog</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
